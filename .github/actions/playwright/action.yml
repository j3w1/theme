name: playwright browsers
description: Install the locked Playwright browsers and system packages for the current runner.
inputs:
  browsers:
    description: Space-separated browser names
    required: true
runs:
  using: composite
  steps:
    # Browser revisions can have different binaries for different Linux releases.
    # A cache keyed only by runner.os can restore an incompatible WebKit build.
    - shell: bash
      run: npx playwright install --with-deps ${{ inputs.browsers }}
