name: playwright browsers
description: Restore the Playwright browser cache for the locked version, then install the browsers and their system packages.
inputs:
  browsers:
    description: Space-separated browser names
    required: true
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ inputs.browsers }}
    - shell: bash
      run: npx playwright install --with-deps ${{ inputs.browsers }}
