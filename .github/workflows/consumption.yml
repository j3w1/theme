name: consumption kit

# Builds the sealed kit for one component so the fresh-agent consumption test
# (tests/consumption/PROTOCOL.md) can be handed off from a reproducible
# artifact. It never runs an agent; a person does that.

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component id (e.g. text-field)
        required: true
        default: text-field
      strict:
        description: Omit tokens.resolved.json from the kit
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/consumption-kit.mjs "${{ inputs.component }}" ${{ inputs.strict && '--strict' || '' }} --out kit
      - uses: actions/upload-artifact@v7
        with:
          name: consumption-kit-${{ inputs.component }}
          path: kit
