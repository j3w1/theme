name: ci

# select → checks → release-gate (D-031, amending D-028).
#
# select reads the changed paths and scripts/ci/proofs.json and decides which
# checks this change needs. A path gets cheaper only when a rule claims it;
# anything unclaimed, and every control file, runs everything.
#
# Pull requests run only the selected checks. A browser subset uses the plain
# list reporter, so it can never publish a partial evidence matrix.
#
# A push to main that changes the site runs the whole matrix with evidence:
# the browser suite in parallel shards merged into one evidence report, the
# packed consumers on three engines, then deploy. A push that does not change
# the site deploys nothing and takes about a minute.
#
# release-gate is the only required check. It recomputes the plan and checks
# that every job ran exactly when the plan said it should, and passed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Optional base commit; with it, only the checks those changes need run. Without it, everything runs.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      deployments: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
      checks: ${{ steps.plan.outputs.checks }}
      build: ${{ steps.plan.outputs.build }}
      smoke: ${{ steps.plan.outputs.smoke }}
      consumers: ${{ steps.plan.outputs.consumers }}
      browser: ${{ steps.plan.outputs.browser }}
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
      deploy: ${{ steps.plan.outputs.deploy }}
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # On main the base is the last commit that reached Pages, so a change
      # that failed to deploy is still counted by the next push.
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"
          elif [ "$EVENT" = push ]; then
            base=$(node scripts/ci/deployed.mjs "$GITHUB_REPOSITORY" || true)
          else base="$DISPATCH_BASE"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.base.outputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=(--event "$EVENT" --head "$HEAD_SHA")
          [ -n "$BASE" ] && args+=(--base "$BASE")
          node scripts/ci/select.mjs "${args[@]}"

  # Sources and unit tests: one install, no browser.
  checks:
    needs: select
    if: needs.select.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Selected sources and unit tests
        run: node scripts/ci/run.mjs cheap
        env:
          PLAN: ${{ needs.select.outputs.plan }}

  # The site, its dist gates and the smoke check, in parallel with the unit
  # tests. The browser shards start when this job, smoke included, passes.
  build:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build the site under /theme/
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Base paths, consistency and private-material gates on dist/
        run: npm run test:dist
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          retention-days: 7
          include-hidden-files: true
      - uses: ./.github/actions/playwright
        if: needs.select.outputs.smoke == 'true'
        with:
          browsers: chromium
      - name: The built site loads, renders from the tokens and takes a keyboard
        if: needs.select.outputs.smoke == 'true'
        run: npm run test:smoke
        env:
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  # Selected specs on a pull request (plain reporter); the whole suite in
  # shards with blob reports on the deployment path.
  browser:
    needs: [select, build]
    if: needs.select.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - name: Browser suite, ${{ matrix.shard }}
        run: node scripts/ci/run.mjs browser ${{ matrix.shard }}
        env:
          CI: "1"
          PLAN: ${{ needs.select.outputs.plan }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ strategy.job-index }}.zip
      - uses: actions/upload-artifact@v7
        if: always() && needs.select.outputs.matrix == 'true'
        with:
          name: blob-report-${{ strategy.job-index }}
          path: blob-report
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-results-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  consumers:
    needs: select
    if: needs.select.outputs.consumers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium firefox webkit
      - name: Install packed HTML, Vue, React, Astro and copy consumers
        run: npm run ui:consumers
      - name: Cross-browser native forms, lifecycle, keyboard and complete copy flows
        run: npm run test:ui
      - name: Record package, fixture and protocol identities
        run: npm run ui:report
      - uses: actions/upload-artifact@v7
        with:
          name: ui-consumer-evidence
          path: .cache/ui-evidence/report.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-consumer-failures
          path: .cache/ui-evidence/
          include-hidden-files: true

  # The deployment path only: one evidence report from every shard, checked
  # against the unchanged specimens, then the Pages artifact.
  evidence:
    needs: [select, checks, build, browser, consumers]
    if: needs.select.outputs.matrix == 'true' && !cancelled() && needs.checks.result == 'success' && needs.build.result == 'success' && needs.browser.result == 'success' && needs.consumers.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: ui-consumer-evidence
          path: .cache/ui-evidence
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Every shard sent its report
        env:
          SHARDS: ${{ needs.select.outputs.shards }}
        run: |
          want=$(node -p "JSON.parse(process.env.SHARDS).length")
          got=$(ls all-blob-reports/*.zip | wc -l)
          echo "blob reports: $got of $want"
          [ "$got" = "$want" ]
      - name: One evidence report from every shard
        run: npx playwright merge-reports --config playwright.merge.config.mjs ./all-blob-reports
        env:
          CI: "1"
      - name: The evidence records every configured test in every project
        run: node scripts/ci/evidence-complete.mjs
      - name: Publish execution report alongside unchanged specimens
        run: npm run verification:report
      - name: Validate report, evidence and immutable specimen digest
        run: npm run verification:check
      - name: Publish matching packed-consumer evidence
        run: npm run ui:publish-evidence
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - name: Report keyboard, filtering and no-JS checks
        run: npm run test:verification
        env:
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: verification-evidence
          path: |
            test-results/evidence*.json
            dist/verification/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: verification-evidence-refused
          path: |
            test-results/evidence*.json
            playwright-report/
          if-no-files-found: ignore

  release-gate:
    needs: [select, checks, build, browser, consumers, evidence]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Every selected check ran and passed; the plan recomputes
        env:
          NEEDS: ${{ toJSON(needs) }}
          PLAN: ${{ needs.select.outputs.plan }}
        run: node scripts/ci/gate.mjs

  deploy:
    needs: [select, release-gate]
    if: ${{ !cancelled() && needs.select.outputs.deploy == 'true' && needs.release-gate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
