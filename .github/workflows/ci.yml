name: ci

# validate → build (+dist gates) → browser → deploy. The dist the browser job
# tests stays byte-identical; only verification/ is added before deployment.
# PRs get specimens and evidence as downloadable artifacts and
# never deploy. Pages is configured to deploy from Actions (D-010).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sources validate
        run: npm run validate
      - name: Generated artifacts are current
        run: npm run check
      - name: Source and export tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the site under /theme/
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Base paths, consistency and private-material gates on dist/
        run: npm run test:dist
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          retention-days: 7
          include-hidden-files: true

  browser:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - name: Keyboard, axe, reflow, motion, no-JS, enhancements, print
        id: browser-tests
        run: npm run test:browser
        env:
          CI: "1"
      - name: Publish execution report alongside unchanged specimens
        if: always()
        run: npm run verification:report
      - name: Validate report, evidence and immutable specimen digest
        if: always()
        run: npm run verification:check
      - name: Report keyboard, filtering and no-JS checks
        if: always()
        run: npm run test:verification
        env:
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-evidence
          path: |
            test-results/evidence*.json
            dist/verification/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: site-with-evidence
          path: dist
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v5
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  deploy:
    runs-on: ubuntu-latest
    needs: [build, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
