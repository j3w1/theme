<!doctype html>
<html lang="en" data-density="compact">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Design mode · j3w1 theme</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/ui/styles/select.css" />
    <link rel="stylesheet" href="/ui/styles/controls.css" />
    <link rel="stylesheet" href="/design.css" />
  </head>
  <body>
    <header class="bar">
      <p class="wordmark">j3w1 <span>/ design mode</span></p>

      <label class="control">Route
        <select id="route"></select>
      </label>

      <label class="control">Path
        <input id="path" type="text" spellcheck="false" autocomplete="off" placeholder="components/button/" />
      </label>

      <label class="control">Width
        <select id="width">
          <option value="1440x1000">1440 × 1000 · desktop</option>
          <option value="1024x900">1024 × 900</option>
          <option value="768x900">768 × 900</option>
          <option value="640x500">640 × 500 · 200% zoom</option>
          <option value="360x740">360 × 740 · narrow</option>
        </select>
      </label>

      <label class="control">Scale
        <select id="zoom">
          <option value="fit">Fit</option>
          <option value="1">100%</option>
          <option value="0.75">75%</option>
          <option value="0.5">50%</option>
        </select>
      </label>

      <fieldset class="modes">
        <legend class="sr-only">Comparison mode</legend>
        <label><input type="radio" name="mode" value="side" checked /> Side by side</label>
        <label><input type="radio" name="mode" value="swipe" /> Swipe</label>
        <label><input type="radio" name="mode" value="blend" /> Blend</label>
        <label><input type="radio" name="mode" value="blink" /> Blink</label>
      </fieldset>

      <label class="control slider" id="split-control" hidden>Split
        <input id="split" type="range" min="0" max="100" value="50" />
      </label>
      <label class="control slider" id="blend-control" hidden>After
        <input id="blend" type="range" min="0" max="100" value="50" />
      </label>

      <label class="control check"><input id="sync" type="checkbox" checked /> Sync scroll</label>

      <div class="bar-actions">
        <button id="reload" type="button">Reload both</button>
        <button id="reanchor" type="button">Re-anchor before</button>
        <button id="toggle-ledger" type="button" aria-expanded="false" aria-controls="ledger">Changes <span id="ledger-count">0</span></button>
      </div>
    </header>

    <p class="status" id="status" role="status"></p>

    <main class="stage" id="stage" data-mode="side">
      <p class="overlay-legend" id="overlay-legend" hidden></p>
      <section class="pane" data-side="before">
        <h2 class="pane-label">Before <span id="before-note"></span></h2>
        <div class="viewport">
          <iframe id="before-frame" title="The site before this session" src="about:blank"></iframe>
          <div class="divider" id="divider" hidden role="separator" aria-hidden="true"></div>
        </div>
      </section>
      <section class="pane" data-side="after">
        <h2 class="pane-label">After <span>live</span></h2>
        <div class="viewport"><iframe id="after-frame" title="The site with this session's changes" src="about:blank"></iframe></div>
      </section>
    </main>

    <aside class="ledger" id="ledger" hidden>
      <div class="ledger-head">
        <h2>Session changes</h2>
        <button id="close-ledger" type="button" aria-label="Close session changes">Close · Esc</button>
      </div>
      <p class="ledger-empty" id="ledger-empty">No changes recorded yet.</p>
      <ol id="ledger-list"></ol>
    </aside>

    <script type="module" src="/app.mjs"></script>
  </body>
</html>
