<!-- @variant start -->
<div class="drawer-backdrop">
  <dialog class="drawer drawer-start" open aria-labelledby="dw-nav-title">
    <div class="drawer-header">
      <h2 class="drawer-title" id="dw-nav-title">Sections</h2>
      <button class="drawer-close" type="button" aria-label="Close">✕</button>
    </div>
    <nav class="drawer-body" aria-label="Sections">
      <ul class="drawer-list">
        <li class="drawer-item"><a class="drawer-link" href="#dw-foundations" aria-current="page">Foundations</a></li>
        <li class="drawer-item"><a class="drawer-link" href="#dw-actions">Actions</a></li>
        <li class="drawer-item"><a class="drawer-link" href="#dw-forms">Forms</a></li>
        <li class="drawer-item"><a class="drawer-link" href="#dw-feedback">Feedback</a></li>
      </ul>
    </nav>
    <p class="drawer-trap-note">Focus is trapped: Tab cycles inside the drawer; Escape closes it.</p>
  </dialog>
</div>
<!-- @variant end -->
<div class="drawer-backdrop">
  <dialog class="drawer drawer-end" open aria-labelledby="dw-filter-title">
    <div class="drawer-header">
      <h2 class="drawer-title" id="dw-filter-title">Filters</h2>
      <button class="drawer-close" type="button" aria-label="Close">✕</button>
    </div>
    <div class="drawer-body">
      <p class="drawer-text">Narrow the table to the rows that match every filter.</p>
      <ul class="drawer-list">
        <li class="drawer-item"><label class="drawer-check"><input class="drawer-checkbox" type="checkbox" checked> Only R1</label></li>
        <li class="drawer-item"><label class="drawer-check"><input class="drawer-checkbox" type="checkbox"> Only tested</label></li>
        <li class="drawer-item"><label class="drawer-check"><input class="drawer-checkbox" type="checkbox"> Hide deprecated</label></li>
      </ul>
    </div>
    <p class="drawer-trap-note">Focus is trapped: Tab cycles inside the drawer; Escape closes it.</p>
  </dialog>
</div>
