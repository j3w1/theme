<div class="search-field" role="search">
  <label class="search-field-label" for="sf-files">Search files</label>
  <div class="search-field-root">
    <svg class="search-field-icon" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M10.5 10.5L14 14"/><rect x="2" y="2" width="9" height="9"/></svg>
    <span class="search-field-loading" aria-hidden="true">⋯</span>
    <input class="search-field-input" id="sf-files" type="search" value="site.css" placeholder="Name or path" autocomplete="off" aria-describedby="sf-files-help sf-files-status">
    <button class="search-field-clear" type="button" aria-label="Clear search files"><svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <p class="search-field-help" id="sf-files-help">Matches names and paths; Escape clears.</p>
  <p class="search-field-status" id="sf-files-status" role="status">No results for “site.css”.</p>
</div>
<!-- @variant with-shortcut -->
<div class="search-field" role="search">
  <label class="search-field-label" for="sf-tokens">Search tokens</label>
  <div class="search-field-root">
    <svg class="search-field-icon" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M10.5 10.5L14 14"/><rect x="2" y="2" width="9" height="9"/></svg>
    <span class="search-field-loading" aria-hidden="true">⋯</span>
    <input class="search-field-input" id="sf-tokens" type="search" value="focus.ring" placeholder="Role or value" autocomplete="off" aria-describedby="sf-tokens-help sf-tokens-status">
    <button class="search-field-clear" type="button" aria-label="Clear search tokens"><svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    <kbd class="search-field-kbd" aria-hidden="true">/</kbd>
  </div>
  <p class="search-field-help" id="sf-tokens-help">Press / anywhere to search.</p>
  <p class="search-field-status" id="sf-tokens-status" role="status">No results for “focus.ring”.</p>
</div>
