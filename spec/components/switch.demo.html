<button class="switch" type="button" role="switch" aria-checked="false" aria-label="Wrap long lines">
  <span class="switch-track"><span class="switch-thumb"></span></span>
</button>
<!-- @variant with-labels -->
<div class="switch-row">
  <span class="switch-name" id="sw-follow-name">Follow system theme</span>
  <button class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="sw-follow-name">
    <span class="switch-track"><span class="switch-thumb"></span></span>
    <span class="switch-state" aria-hidden="true"><span class="switch-state-off">Off</span><span class="switch-state-on">On</span></span>
  </button>
</div>
