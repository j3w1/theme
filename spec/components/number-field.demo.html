<div class="number-field">
  <label class="number-field-label" for="nf-workspaces">Workspaces</label>
  <div class="number-field-root">
    <input class="number-field-input" id="nf-workspaces" type="number" value="10" min="1" max="20" step="1" aria-describedby="nf-workspaces-help nf-workspaces-message">
    <span class="number-field-stepper">
      <button class="number-field-action" type="button" aria-label="Increase workspaces">+</button>
      <button class="number-field-action" type="button" aria-label="Decrease workspaces">−</button>
    </span>
  </div>
  <p class="number-field-help" id="nf-workspaces-help">Between 1 and 20.</p>
  <p class="number-field-message" id="nf-workspaces-message">✕ Between 1 and 20.</p>
</div>
<!-- @variant with-unit -->
<div class="number-field">
  <label class="number-field-label" for="nf-gap">Inner gap (px)</label>
  <div class="number-field-root">
    <input class="number-field-input" id="nf-gap" type="number" value="14" min="0" max="64" step="1" aria-describedby="nf-gap-help nf-gap-message">
    <span class="number-field-unit" aria-hidden="true">px</span>
    <span class="number-field-stepper">
      <button class="number-field-action" type="button" aria-label="Increase inner gap">+</button>
      <button class="number-field-action" type="button" aria-label="Decrease inner gap">−</button>
    </span>
  </div>
  <p class="number-field-help" id="nf-gap-help">Between 0 and 64 pixels; Up and Down step by one.</p>
  <p class="number-field-message" id="nf-gap-message">✕ Between 0 and 64.</p>
</div>
