<fieldset class="fieldset">
  <legend class="fieldset-legend">Window gaps</legend>
  <div class="fieldset-body">
    <div class="fieldset-field">
      <label class="fieldset-label" for="fs-inner">Inner gap</label>
      <input class="fieldset-input" id="fs-inner" type="text" inputmode="numeric" value="14" aria-describedby="fs-inner-help">
      <p class="fieldset-help" id="fs-inner-help">Pixels between windows.</p>
    </div>
    <div class="fieldset-field">
      <label class="fieldset-label" for="fs-outer">Outer gap</label>
      <input class="fieldset-input" id="fs-outer" type="text" inputmode="numeric" value="-2" aria-describedby="fs-outer-help">
      <p class="fieldset-help" id="fs-outer-help">Negative values overlap the screen edge.</p>
    </div>
  </div>
</fieldset>
