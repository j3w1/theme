<div class="time-picker">
  <label class="time-picker-label" for="tp-start">Start time</label>
  <div class="time-picker-root">
    <input class="time-picker-input" id="tp-start" type="time" value="09:30" min="06:00" max="22:00" step="300" aria-describedby="tp-start-help tp-start-message">
  </div>
  <p class="time-picker-help" id="tp-start-help">Between 06:00 and 22:00, in five-minute steps.</p>
  <p class="time-picker-message" id="tp-start-message">✕ Choose a time between 06:00 and 22:00.</p>
</div>
