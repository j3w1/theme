.j3w1-recipe {
  color-scheme: dark;
  background: var(--color-surface-canvas);
  color: var(--color-text-default);
  font-family: var(--font-family-mono);
  font-size: var(--font-size-ui-md);
  line-height: var(--font-line-height-ui-md);
}
.j3w1-recipe, .j3w1-recipe *, .j3w1-recipe *::before, .j3w1-recipe *::after { box-sizing: border-box; }
.j3w1-recipe button, .j3w1-recipe input, .j3w1-recipe select, .j3w1-recipe textarea { font: inherit; }
.j3w1-recipe ::selection {
  background: var(--color-interaction-text-selection-bg);
  color: var(--color-interaction-text-selection-text);
}
.j3w1-recipe .sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.j3w1-recipe .button {
  --_bg: var(--color-action-primary-bg);
  --_fg: var(--color-action-primary-text);
  --_border: var(--color-action-primary-border);
  --_bg-hover: var(--color-action-primary-hover-bg);
  --_fg-hover: var(--color-action-primary-text);
  --_bg-active: var(--color-action-primary-pressed-bg);
  --_border-active: var(--color-action-primary-border);
  --_ring: var(--color-interaction-focus-ring-container);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-4);
  min-height: var(--density-control-height, 32px);
  padding: 0 var(--density-control-padding-x, 12px);
  margin: 0;
  background: var(--_bg);
  color: var(--_fg);
  border: var(--border-width-default) solid var(--_border);
  border-radius: var(--radius-none);
  font: inherit;
  font-size: var(--font-size-ui-md);
  line-height: var(--font-line-height-ui-md);
  white-space: nowrap;
  cursor: pointer;
  outline: 0;
}

.j3w1-recipe .button-secondary {
  --_bg: var(--color-action-secondary-bg);
  --_fg: var(--color-action-secondary-text);
  --_border: var(--color-action-secondary-border);
  --_bg-hover: var(--color-action-secondary-hover-bg);
  --_fg-hover: var(--color-action-secondary-text);
  --_bg-active: var(--color-action-secondary-pressed-bg);
  --_border-active: var(--color-border-active);
  --_ring: var(--color-interaction-focus-ring);
}

.j3w1-recipe .button-tertiary {
  --_bg: transparent;
  --_fg: var(--color-action-tertiary-text);
  --_border: transparent;
  --_bg-hover: var(--color-action-tertiary-hover-bg);
  --_fg-hover: var(--color-action-tertiary-text);
  --_bg-active: var(--color-interaction-pressed-bg);
  --_border-active: var(--color-border-active);
  --_ring: var(--color-interaction-focus-ring);
}

.j3w1-recipe .button-destructive {
  --_bg: transparent;
  --_fg: var(--color-action-destructive-text);
  --_border: var(--color-action-destructive-border);
  --_bg-hover: var(--color-action-destructive-hover-bg);
  --_fg-hover: var(--color-action-destructive-hover-text);
  --_bg-active: var(--color-action-destructive-pressed-bg);
  --_border-active: var(--color-action-destructive-border);
  --_ring: var(--color-interaction-focus-ring);
}
.j3w1-recipe .button-destructive-filled {
  --_bg: var(--color-action-destructive-filled-bg);
  --_fg: var(--color-action-destructive-filled-text);
  --_border: var(--color-action-destructive-border);
  --_bg-hover: var(--color-action-destructive-hover-bg);
  --_fg-hover: var(--color-action-destructive-hover-text);
  --_bg-active: var(--color-action-destructive-pressed-bg);
  --_border-active: var(--color-action-destructive-border);
  --_ring: var(--color-action-destructive-filled-text);
}

.j3w1-recipe .button-icon {
  flex: none;
  width: var(--icon-size-md);
  height: var(--icon-size-md);
  stroke: currentColor;
  fill: none;
}

.j3w1-recipe .button-loading {
  display: none;
  flex: none;
}

.j3w1-recipe .button-label {
  min-width: 0;
}
@media (hover: hover) {
  .j3w1-recipe .button:hover {
    --_bg: var(--_bg-hover);
    --_fg: var(--_fg-hover);
  }

  .j3w1-recipe .button-destructive:hover {
    --_ring: var(--color-action-destructive-hover-text);
  }
}
.j3w1-recipe .button:active {
  --_bg: var(--_bg-active);
  --_fg: var(--_fg-hover);
  --_border: var(--_border-active);
}
.j3w1-recipe .button:focus-visible {
  outline: var(--border-width-default) dashed var(--_ring);
  outline-offset: var(--focus-offset);
}
.j3w1-recipe .button[aria-busy="true"] .button-loading {
  display: inline;
}

.j3w1-recipe .button[aria-busy="true"] .button-icon {
  display: none;
}

.j3w1-recipe .button[aria-busy="true"] {
  cursor: progress;
}
.j3w1-recipe .button:disabled {
  --_bg: var(--color-interaction-disabled-bg);
  --_fg: var(--color-text-disabled);
  --_border: var(--color-border-disabled);
  --_bg-hover: var(--color-interaction-disabled-bg);
  --_fg-hover: var(--color-text-disabled);
  --_bg-active: var(--color-interaction-disabled-bg);
  --_border-active: var(--color-border-disabled);
  cursor: not-allowed;
}

@media (prefers-reduced-motion: no-preference) {
  .j3w1-recipe .button {
    transition: background-color var(--motion-duration-fast);
  }
}

@media (forced-colors: active) {
  .j3w1-recipe .button:focus-visible {
    outline-color: Highlight;
  }
}

.j3w1-recipe .text-field {
  position: relative;
  display: grid;
  gap: var(--space-4);
  min-width: 0;
  max-width: calc(var(--font-size-ui-md) * 28);
  color: var(--color-text-default);
}

.j3w1-recipe .text-field-label {
  color: var(--color-text-bright);
  font-size: var(--font-size-ui-sm);
  line-height: var(--font-line-height-ui-sm);
}

.j3w1-recipe .text-field-required {
  display: none;
  color: var(--color-status-danger-text);
}

.j3w1-recipe .text-field-root {
  display: flex;
  min-width: 0;
  align-items: stretch;
  min-height: var(--density-control-height, 32px);
  background: var(--color-surface-input);
  border: var(--border-width-default) solid var(--color-border-control);
  border-radius: var(--radius-none);
}

.j3w1-recipe .text-field-input {
  flex: 1 1 auto;
  min-width: 0;
  padding: 0 var(--density-control-padding-x, 12px);
  background: transparent;
  border: 0;
  color: var(--color-text-default);
  caret-color: var(--color-code-caret);
  font: inherit;
  outline: 0;
}

.j3w1-recipe .text-field-input::placeholder {
  color: var(--color-text-placeholder);
  font-style: italic;
  opacity: 1;
}

.j3w1-recipe .text-field-input::selection {
  background: var(--color-interaction-text-selection-bg);
  color: var(--color-interaction-text-selection-text);
}

.j3w1-recipe .text-field-input-numeric {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.j3w1-recipe .text-field-input::-webkit-search-cancel-button,
.j3w1-recipe .text-field-input::-webkit-inner-spin-button,
.j3w1-recipe .text-field-input::-webkit-outer-spin-button {
  appearance: none;
  display: none;
}

.j3w1-recipe .text-field-affix {
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
  padding: 0 var(--space-8);
  color: var(--color-text-muted);
  border-inline-end: var(--border-width-default) solid var(--color-border-divider);
}

.j3w1-recipe .text-field-input ~ .text-field-affix {
  border-inline-end: 0;
  border-inline-start: var(--border-width-default) solid var(--color-border-divider);
}

.j3w1-recipe .text-field-action {
  padding: 0 var(--space-8);
  white-space: nowrap;
  background: transparent;
  border: 0;
  border-inline-start: var(--border-width-default) solid var(--color-border-divider);
  color: var(--color-action-tertiary-text);
  font: inherit;
  cursor: pointer;
}

.j3w1-recipe .text-field-action:hover {
  background: var(--color-action-tertiary-hover-bg);
}

.j3w1-recipe .text-field-action:focus-visible {
  outline: var(--focus-ring);
  outline-offset: var(--focus-offset);
}

.j3w1-recipe .text-field-stepper {
  display: flex;
}

.j3w1-recipe .text-field-loading {
  display: none;
  align-items: center;
  padding: 0 var(--space-8);
  color: var(--color-text-muted);
}

.j3w1-recipe .text-field-help {
  margin: 0;
  color: var(--color-text-muted);
  font-size: var(--font-size-ui-sm);
  line-height: var(--font-line-height-ui-sm);
}

.j3w1-recipe .text-field-message {
  display: none;
  margin: 0;
  color: var(--color-status-danger-text);
  font-size: var(--font-size-ui-sm);
  line-height: var(--font-line-height-ui-sm);
}
.j3w1-recipe .text-field-root:hover {
  background: var(--color-interaction-hover-bg);
}
.j3w1-recipe .text-field-root:has(.text-field-input:focus-visible) {
  border-color: var(--color-border-active);
  outline: var(--focus-ring);
  outline-offset: var(--focus-offset);
}
.j3w1-recipe .text-field:has(.text-field-input:required) .text-field-required {

<body class="j3w1-recipe" data-density="comfortable"><main>
<h1>Settings</h1><p>Choose your display name and notification preference.</p>
<form id="settings" autocomplete="off">
<div class="text-field"><label class="text-field-label" for="display-name">Display name</label><div class="text-field-root"><input class="text-field-input" id="display-name" name="display-name" type="text" placeholder="Your display name" aria-describedby="display-name-help"></div><p id="display-name-help" class="text-field-help">Shown in the confirmation before you save.</p></div>
<label class="checkbox-option" for="notifications"><span class="checkbox-control"><input id="notifications" name="notifications" type="checkbox"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m3 8 3 3 7-7"/></svg></span><span>Enable notifications</span></label>
<div class="actions"><button class="button" id="save" type="submit">Save</button></div>
</form>
<p id="status" role="status" aria-live="polite" aria-atomic="true">No settings confirmed.</p>
<noscript><p>JavaScript is required to open the confirmation. Settings cannot be confirmed while JavaScript is disabled.</p><style>#save {display:none;}</style></noscript>
</main>
<dialog class="dialog" id="confirmation" role="alertdialog" aria-labelledby="confirmation-title" aria-describedby="confirmation-description" tabindex="-1">
<header class="dialog-header"><h2 id="confirmation-title">Confirm settings</h2><button class="button button-tertiary" id="close" type="button" autofocus>Close</button></header>
<div class="dialog-body" tabindex="0" role="region" aria-label="Settings confirmation details"><p id="confirmation-description">Confirm these settings for this page. Nothing is sent or stored.</p><dl><dt>Display name</dt><dd id="summary-name"></dd><dt>Notifications</dt><dd id="summary-notifications"></dd></dl><p class="note">Tab cycles within this dialog. Escape cancels.</p></div>
<div class="actions"><button class="button button-secondary" id="cancel" type="button">Cancel</button><button class="button" id="confirm" type="button">Confirm</button></div>
</dialog>
<script>
const form = document.querySelector('#settings');
const modal = document.querySelector('#confirmation');
const save = document.querySelector('#save');
const status = document.querySelector('#status');
let pending;
let confirmations = 0;
form.addEventListener('submit', event => {
  event.preventDefault();
  if (modal.open) return;
  pending = { name: document.querySelector('#display-name').value, notifications: document.querySelector('#notifications').checked };
  document.querySelector('#summary-name').textContent = pending.name || '(empty)';
  document.querySelector('#summary-notifications').textContent = pending.notifications ? 'Enabled' : 'Disabled';
  modal.showModal();
});
for (const id of ['close', 'cancel']) document.getElementById(id).addEventListener('click', () => modal.close('cancel'));
modal.addEventListener('keydown', event => {
  if (event.key !== 'Tab') return;
  const first = document.querySelector('#close');
  const last = document.querySelector('#confirm');
  if (event.shiftKey && (document.activeElement === first || document.activeElement === modal)) {
    event.preventDefault(); last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault(); first.focus();
  }
});
modal.addEventListener('close', () => { pending = undefined; save.focus(); });
document.querySelector('#confirm').addEventListener('click', () => {
  if (!pending) return;
  confirmations += 1;
  status.textContent = '✓ Settings confirmed (' + confirmations + '). Display name: ' + (pending.name || '(empty)') + '. Notifications: ' + (pending.notifications ? 'enabled' : 'disabled') + '. Nothing was sent or stored.';
  modal.close('confirm');
});
</script></body></html>
